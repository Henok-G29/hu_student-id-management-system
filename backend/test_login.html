<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>HU Student ID - API Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .section {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 16px;
      margin: 5px;
      cursor: pointer;
    }

    #result {
      padding: 20px;
      background: #f5f5f5;
      border: 2px solid #ccc;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
    }

    .success {
      border-color: green !important;
      background: #f0fff0 !important;
    }

    .error {
      border-color: red !important;
      background: #fff0f0 !important;
    }

    .info {
      border-color: blue !important;
      background: #f0f5ff !important;
    }
  </style>
</head>

<body>

  <h1>HU Student ID API Test</h1>


  <!-- LOGIN -->

  <div class="section">

    <h2>1. Login</h2>

    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          required
        />

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          required
        />

      </div>


      <button type="submit">
        Login
      </button>

    </form>

  </div>


  <!-- AUTHENTICATION -->

  <div class="section">

    <h2>2. Authentication Test</h2>

    <button id="protectedButton">
      Test Protected API
    </button>

  </div>


  <!-- PERMISSION -->

  <div class="section">

    <h2>3. Permission Test</h2>

    <button id="permissionButton">
      Test students.view Permission
    </button>

  </div>


  <!-- RESULT -->

  <div class="section">

    <h2>Server Response</h2>

    <pre id="result">
Waiting for request...
    </pre>

  </div>


  <script>

    let authToken = null;


    const loginForm =
      document.getElementById("loginForm");

    const protectedButton =
      document.getElementById(
        "protectedButton"
      );

    const permissionButton =
      document.getElementById(
        "permissionButton"
      );

    const result =
      document.getElementById("result");


    // ======================================
    // DISPLAY RESULT
    // ======================================

    function displayResult(
      title,
      status,
      body,
      isSuccess
    ) {

      result.className =
        isSuccess
          ? "success"
          : "error";


      result.textContent =
`${title}

HTTP STATUS:
${status}

RESPONSE BODY:
${body}`;
    }


    // ======================================
    // LOGIN
    // ======================================

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        result.className = "info";

        result.textContent =
          "Sending login request...";


        const email =
          document.getElementById(
            "email"
          ).value;

        const password =
          document.getElementById(
            "password"
          ).value;


        try {

          const response =
            await fetch(
              "http://127.0.0.1:3000/api/auth/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email,
                  password
                })
              }
            );


          const body =
            await response.text();


          console.log(
            "LOGIN STATUS:",
            response.status
          );

          console.log(
            "LOGIN BODY:",
            body
          );


          let data;

          try {

            data =
              JSON.parse(body);

          } catch {

            displayResult(
              "LOGIN RESPONSE IS NOT JSON",
              response.status,
              body,
              false
            );

            return;
          }


          if (!response.ok) {

            displayResult(
              "LOGIN FAILED",
              response.status,
              JSON.stringify(
                data,
                null,
                2
              ),
              false
            );

            return;
          }


          authToken =
            data.data.token;


          displayResult(
            "LOGIN SUCCESS",
            response.status,
            JSON.stringify(
              data,
              null,
              2
            ),
            true
          );


        } catch (error) {

          displayResult(
            "LOGIN REQUEST FAILED",
            "NO RESPONSE",
            error.message,
            false
          );

        }

      }
    );


    // ======================================
    // PROTECTED API
    // ======================================

    protectedButton.addEventListener(
      "click",
      async () => {

        if (!authToken) {

          displayResult(
            "AUTHENTICATION ERROR",
            "-",
            "Please login first.",
            false
          );

          return;
        }


        try {

          const response =
            await fetch(
              "http://127.0.0.1:3000/api/test/protected",
              {
                method: "GET",

                headers: {
                  "Authorization":
                    `Bearer ${authToken}`
                }
              }
            );


          const body =
            await response.text();


          console.log(
            "PROTECTED STATUS:",
            response.status
          );

          console.log(
            "PROTECTED BODY:",
            body
          );


          let data;

          try {

            data =
              JSON.parse(body);

          } catch {

            displayResult(
              "PROTECTED API RETURNED NON-JSON",
              response.status,
              body,
              false
            );

            return;
          }


          displayResult(
            "PROTECTED API RESPONSE",
            response.status,
            JSON.stringify(
              data,
              null,
              2
            ),
            response.ok
          );


        } catch (error) {

          displayResult(
            "PROTECTED REQUEST FAILED",
            "NO RESPONSE",
            error.message,
            false
          );

        }

      }
    );


    // ======================================
    // PERMISSION API
    // ======================================

    permissionButton.addEventListener(
      "click",
      async () => {

        if (!authToken) {

          displayResult(
            "AUTHENTICATION ERROR",
            "-",
            "Please login first.",
            false
          );

          return;
        }


        try {

          const response =
            await fetch(
              "http://127.0.0.1:3000/api/test/permission-test",
              {
                method: "GET",

                headers: {
                  "Authorization":
                    `Bearer ${authToken}`
                }
              }
            );


          const body =
            await response.text();


          console.log(
            "PERMISSION STATUS:",
            response.status
          );

          console.log(
            "PERMISSION BODY:",
            body
          );


          let data;

          try {

            data =
              JSON.parse(body);

          } catch {

            displayResult(
              "PERMISSION API RETURNED NON-JSON",
              response.status,
              body,
              false
            );

            return;
          }


          displayResult(
            "PERMISSION API RESPONSE",
            response.status,
            JSON.stringify(
              data,
              null,
              2
            ),
            response.ok
          );


        } catch (error) {

          displayResult(
            "PERMISSION REQUEST FAILED",
            "NO RESPONSE",
            error.message,
            false
          );

        }

      }
    );

  </script>

</body>
</html>
